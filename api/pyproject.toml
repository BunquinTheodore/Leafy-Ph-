[project]
name = "leafy-api"
version = "0.1.0"
description = "Leafy plant leaf disease API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
  "boto3>=1.35",
  "pillow>=10.4",
  "slowapi>=0.1.9",
  "httpx>=0.27",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
  "transformers>=5.18.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-postgresql>=6.1",
  "pytest-cov>=5.0",
  "moto[s3,server]>=5.0",
  "ruff>=0.8",
  "mypy>=1.11",
  "respx>=0.21",
  "pip-audit>=2.10.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "tools"]
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real Postgres (pytest-postgresql)",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread", "greenlet"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
