name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leafy
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: leafy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leafy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://leafy:ci-throwaway-password@localhost:5432/leafy_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      ML_SERVICE: stub
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: uvx pip-audit --skip-editable || true

  app:
    name: App (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size budget
        run: pnpm budget
      - name: Dependency audit
        run: pnpm audit --prod || true

  lighthouse:
    name: Lighthouse and axe (real stack)
    runs-on: ubuntu-latest
    needs: [api, app]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leafy
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: leafy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leafy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://leafy:ci-throwaway-password@localhost:5432/leafy
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      ENV: dev
      ML_SERVICE: dev-fake
      GOOGLE_MOCK: "1"
      RATE_LIMIT_ENABLED: "false"
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-only-secret
      API_INTERNAL_URL: http://127.0.0.1:8000
      COOKIE_SECURE: "false"
      COOKIE_PREFIX: ""
      NEXT_TELEMETRY_DISABLED: "1"
      LEAFY_CI_USER: lighthouse.ci@leafy.test
      LEAFY_CI_PASSWORD: Lighthouse-Ci-Passw0rd!x
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv python install 3.12
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Start S3 (moto), migrate, seed and start the API
        working-directory: api
        run: |
          uv sync --frozen
          nohup uv run moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          until curl -s http://127.0.0.1:9000/ > /dev/null; do sleep 1; done
          uv run python -c "import boto3; c=boto3.client('s3',endpoint_url='http://127.0.0.1:9000',aws_access_key_id='ci',aws_secret_access_key='ci-only-secret',region_name='us-east-1'); [c.create_bucket(Bucket=b) for b in ('leafy-scans','leafy-catalog')]"
          uv run alembic upgrade head
          uv run python -m app.seeds
          nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          until curl -sf http://127.0.0.1:8000/api/v1/healthz > /dev/null; do sleep 1; done
      - name: Install and build the app
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Register the audit user
        run: |
          curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/register             -H 'content-type: application/json'             -d "{\"email\":\"$LEAFY_CI_USER\",\"password\":\"$LEAFY_CI_PASSWORD\",\"first_name\":\"Lighthouse\",\"last_name\":\"Ci\"}" > /dev/null
      - name: axe accessibility scan (zero serious or critical)
        working-directory: app
        env:
          APP_ORIGIN: http://127.0.0.1:3000
        run: |
          nohup pnpm start > web.log 2>&1 &
          until curl -sf http://127.0.0.1:3000/robots.txt > /dev/null; do sleep 1; done
          pnpm exec playwright install --with-deps chromium
          pnpm a11y:axe
          pkill -f "next start" || true
      - name: Chrome wrapper that accepts the local self signed certificate
        run: |
          REAL="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          WRAP="$RUNNER_TEMP/chrome-lh"
          printf '#!/bin/sh\nexec "%s" --ignore-certificate-errors --no-sandbox --disable-gpu "$@"\n' "$REAL" > "$WRAP"
          chmod +x "$WRAP"
          echo "CHROME_PATH=$WRAP" >> "$GITHUB_ENV"
      - name: Lighthouse, public pages, mobile
        working-directory: app
        env:
          APP_ORIGIN: https://localhost:3443
        run: pnpm lhci
      - name: Lighthouse, public pages, desktop
        working-directory: app
        env:
          APP_ORIGIN: https://localhost:3443
        run: pnpm lhci:desktop
      - name: Lighthouse, signed in pages, mobile
        working-directory: app
        env:
          APP_ORIGIN: https://localhost:3443
        run: |
          TOKENS=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login             -H 'content-type: application/json'             -d "{\"email\":\"$LEAFY_CI_USER\",\"password\":\"$LEAFY_CI_PASSWORD\"}")
          ACCESS=$(echo "$TOKENS" | jq -r .data.access_token)
          REFRESH=$(echo "$TOKENS" | jq -r .data.refresh_token)
          pnpm lhci:member --collect.settings.extraHeaders="{\"Cookie\":\"leafy_at=$ACCESS; leafy_rt=$REFRESH\"}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            app/.lighthouseci*/
            app/web.log
            api/api.log
          if-no-files-found: ignore

  docker:
    name: Docker (compose config, hadolint, image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: docker compose --env-file .env.example config --quiet
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
      - name: Build api image
        run: docker build --tag leafy-api:ci api
      - name: Build app image
        run: docker build --tag leafy-app:ci app
      - name: Image runs as non-root
        run: |
          test "$(docker run --rm --entrypoint id leafy-api:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id leafy-app:ci -u)" != "0"

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
