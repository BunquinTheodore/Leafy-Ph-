{% extends "base.html" %}
{% block content %}
<p class="body-text" style="margin: 0 0 16px 0;">Hello {{ first_name }},</p>
<p class="body-text" style="margin: 0 0 16px 0;">Please confirm your email address so you can scan leaves with Leafy.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 24px 0;">
  <tr><td class="button"><a href="{{ action_url }}">Verify my email</a></td></tr>
</table>
<p class="muted" style="margin: 0 0 8px 0;">This link works for {{ expires_in }}. If the button does not work, copy this address into your browser.</p>
<p class="muted" style="margin: 0;"><a class="link" href="{{ action_url }}">{{ action_url }}</a></p>
{% endblock %}
