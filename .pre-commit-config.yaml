repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^api/
      - id: ruff-format
        files: ^api/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: app-lint
        name: app eslint
        entry: pnpm --dir app lint
        language: system
        files: ^app/
        pass_filenames: false
      - id: app-prettier
        name: app prettier check
        entry: pnpm --dir app format:check
        language: system
        files: ^app/
        pass_filenames: false
