# Leafy stack. Requires a root .env (copy .env.example).
# Production: only `app` publishes a port. See docker-compose.override.yml for dev ports.
name: leafy

x-api-env: &api-env
  # Defaults to prod so every production guard is on. docker-compose.override.yml sets dev.
  ENV: ${ENV:-prod}
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  REFRESH_FAMILY_MAX_DAYS: ${REFRESH_FAMILY_MAX_DAYS:-90}
  REFRESH_GRACE_SECONDS: ${REFRESH_GRACE_SECONDS:-10}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_SCANS_BUCKET: ${S3_SCANS_BUCKET:-leafy-scans}
  S3_CATALOG_BUCKET: ${S3_CATALOG_BUCKET:-leafy-catalog}
  ML_SERVICE: ${ML_SERVICE:-stub}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
  SCAN_QUOTA: ${SCAN_QUOTA:-500}
  # Google sign in via Firebase Auth: the API only verifies the ID token (no secret). Empty disables it.
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  GOOGLE_MOCK: ${GOOGLE_MOCK:-0}
  # Next forwards one validated client address, so the API trusts exactly one hop.
  TRUSTED_PROXY_HOPS: ${API_TRUSTED_PROXY_HOPS:-1}
  HF_HOME: /tmp/huggingface
  ML_LEAF_GATE: ${ML_LEAF_GATE:-true}
  ML_LEAF_MIN_PROB: ${ML_LEAF_MIN_PROB:-0.5}
  ML_MIN_CONFIDENCE: ${ML_MIN_CONFIDENCE:-0.5}
  ML_INPUT_SIZE: ${ML_INPUT_SIZE:-256}
  ML_LETTERBOX: ${ML_LETTERBOX:-true}
  ML_NORMALIZE: ${ML_NORMALIZE:-none}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leafy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leafy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leafy} -d ${POSTGRES_DB:-leafy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z  # upstream MinIO is archived, pinned to the last known community release; revisit (Garage/RustFS)
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One shot job: creates buckets, makes the catalog bucket public read, and creates
  # a scoped service key (read/write on the two Leafy buckets only).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_SCANS_BUCKET: ${S3_SCANS_BUCKET:-leafy-scans}
      S3_CATALOG_BUCKET: ${S3_CATALOG_BUCKET:-leafy-catalog}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_SCANS_BUCKET"
        mc mb --ignore-existing "local/$$S3_CATALOG_BUCKET"
        mc anonymous set none "local/$$S3_SCANS_BUCKET"
        mc anonymous set download "local/$$S3_CATALOG_BUCKET"
        cat > /tmp/leafy-policy.json <<POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket", "s3:GetBucketLocation"],
              "Resource": [
                "arn:aws:s3:::$$S3_SCANS_BUCKET", "arn:aws:s3:::$$S3_SCANS_BUCKET/*",
                "arn:aws:s3:::$$S3_CATALOG_BUCKET", "arn:aws:s3:::$$S3_CATALOG_BUCKET/*"
              ]
            }
          ]
        }
        POLICY
        mc admin policy create local leafy-service /tmp/leafy-policy.json || true
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" || true
        mc admin policy attach local leafy-service --user "$$S3_ACCESS_KEY" || true
        echo "minio-init done"
    networks: [internal]

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # api/entrypoint.sh (default command "serve") runs: alembic upgrade head, seeds, then uvicorn.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  purge:
    build:
      context: ./api
    restart: unless-stopped
    environment: *api-env
    # The entrypoint execs any command other than "serve" as is (no migrate or seed here).
    # --loop also runs cleanup_tokens every few ticks, so no separate cleanup service is needed.
    command: ["python", "-m", "app.jobs.purge_storage", "--loop"]
    # The image HEALTHCHECK probes the HTTP API, which this worker does not serve.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  app:
    build:
      context: ./app
      # NEXT_PUBLIC values are inlined into the browser bundle at build time (public identifiers).
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_AUTH_MOCK: ${NEXT_PUBLIC_AUTH_MOCK:-0}
    restart: unless-stopped
    environment:
      ENV: ${ENV:-prod}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_PREFIX: ${COOKIE_PREFIX:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      GOOGLE_MOCK: ${GOOGLE_MOCK:-0}
      # Runtime copy: the CSP frame-src allows the Firebase auth domain.
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      # Added to the CSP img-src so browsers may load presigned scan photos and catalog images.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      TRUSTED_PROXY_HOPS: ${WEB_TRUSTED_PROXY_HOPS:-0}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks: [internal, public]

volumes:
  pgdata:
  miniodata:

networks:
  internal:
  public:
