title = "Leafy gitleaks config"

[extend]
useDefault = true

# gitleaks 8.24 (used by the CI action) reads the singular [allowlist] table.
[allowlist]
description = "Fake token used as a unit test fixture, not a secret"
paths = ['''api/tests/unit/accounts_catalog/test_email_composition\.py''']
regexes = ['''tok_abc-123_XYZ''']
