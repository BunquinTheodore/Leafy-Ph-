# Dev only. Docker Compose loads this automatically next to docker-compose.yml.
# Production: run with `docker compose -f docker-compose.yml up -d` to publish only `app`.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
  api:
    environment:
      ENV: dev
    ports:
      - "127.0.0.1:8000:8000"
  purge:
    environment:
      ENV: dev
  app:
    environment:
      ENV: dev
